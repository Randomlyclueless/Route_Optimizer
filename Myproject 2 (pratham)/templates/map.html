<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteX - Route Planner</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"
    />

    <!-- Leaflet Routing Machine CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"
    />

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Segoe UI", sans-serif;
      }
      #map {
        height: 100%;
        z-index: 1;
      }
      .overlay-card {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        padding: 20px;
        max-width: 300px;
      }
    </style>
  </head>
  <body>
    <!-- UI Overlay -->
    <div class="overlay-card">
      <h5 class="mb-2">
        <i class="fas fa-route me-2 text-primary"></i>Route Summary
      </h5>
      <p class="mb-1"><strong>From:</strong> Pune</p>
      <p class="mb-1"><strong>To:</strong> Shivajinagar</p>
      <button
        class="btn btn-sm btn-outline-primary mt-2"
        onclick="location.reload()"
      >
        Refresh Route
      </button>
    </div>

    <!-- Leaflet Map -->
    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>

    <script>
      const map = L.map("map").setView([18.526, 73.852], 14);

      // Add tile layer
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors",
      }).addTo(map);

      // Custom icons
      const startIcon = L.AwesomeMarkers.icon({
        icon: "play",
        markerColor: "green",
        prefix: "fa",
      });

      const endIcon = L.AwesomeMarkers.icon({
        icon: "flag-checkered",
        markerColor: "red",
        prefix: "fa",
      });

      const startCoords = [18.5213738, 73.8545071]; // Pune
      const endCoords = [18.5325915, 73.8513115]; // Shivajinagar

      // Add custom markers
      L.marker(startCoords, { icon: startIcon })
        .bindPopup("Start: Pune")
        .addTo(map);

      L.marker(endCoords, { icon: endIcon })
        .bindPopup("End: Shivajinagar")
        .addTo(map);

      // Add dynamic routing
      L.Routing.control({
        waypoints: [L.latLng(...startCoords), L.latLng(...endCoords)],
        routeWhileDragging: false,
        show: false,
        addWaypoints: false,
        draggableWaypoints: false,
        createMarker: function () {
          return null; // Prevents default blue markers
        },
      }).addTo(map);
    </script>
  </body>
</html>
