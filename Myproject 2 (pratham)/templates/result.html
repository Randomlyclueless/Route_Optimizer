<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteX - Route Planner</title>

    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.css"
    />

    <!-- Leaflet Routing Machine CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"
    />

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css"
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #map {
        height: 100%;
        z-index: 1;
      }
      .overlay-card {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 999;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        padding: 20px;
        width: 320px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .card-title {
        font-weight: 600;
        color: #2c3e50;
        display: flex;
        align-items: center;
        margin-bottom: 16px;
      }
      .card-title i {
        margin-right: 10px;
        color: #3498db;
      }
      .location-info {
        margin-bottom: 15px;
      }
      .location-label {
        font-size: 13px;
        color: #7f8c8d;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .location-value {
        font-weight: 500;
        color: #34495e;
        padding-left: 2px;
      }
      .route-stats {
        margin: 18px 0;
        padding: 15px 0;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }
      .stat-item {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
      }
      .stat-item:last-child {
        margin-bottom: 0;
      }
      .stat-icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(52, 152, 219, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-right: 12px;
        color: #3498db;
        font-size: 12px;
      }
      .stat-value {
        font-weight: 600;
        color: #2c3e50;
      }
      .btn-refresh {
        width: 100%;
        background: #3498db;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: 500;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-refresh:hover {
        background: #2980b9;
        transform: translateY(-1px);
      }
      .btn-refresh i {
        margin-right: 6px;
      }
      .pulse {
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <!-- UI Overlay -->
    <div class="overlay-card">
      <div class="card-title">
        <i class="fas fa-route"></i>
        <span>Route Summary</span>
      </div>

      <div class="location-info">
        <div class="location-label">Starting Point</div>
        <div class="location-value">Pune, Maharashtra</div>
      </div>

      <div class="location-info">
        <div class="location-label">Destination</div>
        <div class="location-value">Shivajinagar, Pune</div>
      </div>

      <div class="route-stats">
        <div class="stat-item">
          <div class="stat-icon"><i class="fas fa-road"></i></div>
          <div>
            <div class="location-label">Distance</div>
            <div class="stat-value">
              <span id="distance" class="pulse">Calculating...</span>
            </div>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div>
            <div class="location-label">Estimated Time</div>
            <div class="stat-value">
              <span id="time" class="pulse">Calculating...</span>
            </div>
          </div>
        </div>
      </div>

      <button class="btn-refresh" onclick="location.reload()">
        <i class="fas fa-sync-alt"></i> Refresh Route
      </button>
    </div>

    <!-- Leaflet Map -->
    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Leaflet.awesome-markers/2.0.2/leaflet.awesome-markers.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.min.js"></script>

    <script>
      const map = L.map("map").setView([18.526, 73.852], 14);

      // Add tile layer
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution:
          "&copy; <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors",
      }).addTo(map);

      // Custom icons
      const startIcon = L.AwesomeMarkers.icon({
        icon: "play",
        markerColor: "green",
        prefix: "fa",
      });

      const endIcon = L.AwesomeMarkers.icon({
        icon: "flag-checkered",
        markerColor: "red",
        prefix: "fa",
      });

      const startCoords = [18.5213738, 73.8545071]; // Pune
      const endCoords = [18.5325915, 73.8513115]; // Shivajinagar

      // Add custom markers
      L.marker(startCoords, { icon: startIcon })
        .bindPopup("<b>Start Point</b><br>Pune, Maharashtra")
        .addTo(map);

      L.marker(endCoords, { icon: endIcon })
        .bindPopup("<b>Destination</b><br>Shivajinagar, Pune")
        .addTo(map);

      // Add dynamic routing
      const control = L.Routing.control({
        waypoints: [L.latLng(...startCoords), L.latLng(...endCoords)],
        routeWhileDragging: false,
        show: false,
        addWaypoints: false,
        draggableWaypoints: false,
        createMarker: function () {
          return null; // Prevents default blue markers
        },
        lineOptions: {
          styles: [{ color: "#3498db", opacity: 0.8, weight: 5 }],
        },
      }).addTo(map);

      // Listen for route calculation
      control.on("routesfound", function (e) {
        const routes = e.routes;
        const distance = routes[0].summary.totalDistance;
        const time = routes[0].summary.totalTime;

        // Convert meters to kilometers
        const distanceKm = (distance / 1000).toFixed(1);

        // Convert seconds to minutes
        const timeMin = Math.round(time / 60);

        // Format time display
        let timeDisplay;
        if (timeMin > 60) {
          const hours = Math.floor(timeMin / 60);
          const mins = timeMin % 60;
          timeDisplay = `${hours}h ${mins}m`;
        } else {
          timeDisplay = `${timeMin} min`;
        }

        // Update the UI
        document.getElementById("distance").textContent = `${distanceKm} km`;
        document.getElementById("distance").classList.remove("pulse");
        document.getElementById("time").textContent = timeDisplay;
        document.getElementById("time").classList.remove("pulse");

        // Add slight animation to stats
        const stats = document.querySelectorAll(".stat-value");
        stats.forEach((stat) => {
          stat.style.transform = "scale(1.05)";
          setTimeout(() => {
            stat.style.transform = "scale(1)";
          }, 200);
        });
      });
    </script>
  </body>
</html>
